name: Build ComboCode Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --noconfirm ComboCode.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComboCode-Windows-v3
          path: dist/ComboCode v3.exe
