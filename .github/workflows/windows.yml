name: Build ComboCode Windows

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --noconfirm ComboCode.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComboCode-Windows-J8.0.2
          path: dist/ComboCode J8.0.2.exe


      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jump = (Get-Content VERSION -Raw).Trim()
          $tag = "v$($jump.Substring(1))"
          $exe = "dist/ComboCode $jump.exe"

          git fetch --tags
          if (-not (git tag --list $tag)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe --title "ComboCode $jump" --notes "Windows standalone build. Fix MIE form focus and add direct Screen Saver settings route."
          } else {
            Write-Host "Release $tag already present."
          }
